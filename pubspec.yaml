name: alternia
description: "AlterniA — Compagnon pédagogique intelligent pour le programme scolaire malien."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  # ── UI ──────────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.0

  # ── Navigation ──────────────────────────────────────────────────────────────
  go_router: ^14.8.1

  # ── State Management ────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Network ─────────────────────────────────────────────────────────────────
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.1.4

  # ── Functional Programming ──────────────────────────────────────────────────
  fpdart: ^1.1.0

  # ── Storage local ───────────────────────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ── Sérialisation ───────────────────────────────────────────────────────────
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # ── Device Discovery (Wi-Fi) ────────────────────────────────────────────────
  network_info_plus: ^6.1.1

  # ── Camera & Image ──────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # ── Permissions ─────────────────────────────────────────────────────────────
  permission_handler: ^11.4.0

  # ── Utilitaires ─────────────────────────────────────────────────────────────
  logger: ^2.4.0
  uuid: ^4.4.2
  intl: ^0.19.0
  flutter_markdown: ^0.7.7+1
  flutter_tts: ^4.2.5
  audioplayers: ^6.1.0
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.4.13
  riverpod_generator: ^2.6.5
  freezed: ^3.0.0-dev.3
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # ── Assets AlterniA ─────────────────────────────────────────────────────────
  assets:
    - assets/images/
    - assets/images/culture/
    - assets/images/culture/personnages/
    - assets/images/culture/monuments/
    - assets/images/culture/villes/
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/icone_1024.png"
  web:
    generate: true
    image_path: "assets/icons/icone.ico"

